version: '3.8'

services:
  db:
    build:
      context: .
      dockerfile: docker/Postgres.dockerfile
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-adventure_diary}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-adventure_diary_dev}
      POSTGRES_DB: ${DATABASE_NAME:-adventure_diary_development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-adventure_diary} -d ${DATABASE_NAME:-adventure_diary_development}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/Development.dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    environment:
      RAILS_ENV: development
      DATABASE_ADAPTER: postgresql
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-adventure_diary_development}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-adventure_diary}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-adventure_diary_dev}
    volumes:
      - .:/app:cached
      - bundle_cache:/usr/local/bundle
      - rails_cache:/app/tmp/cache
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
  rails_cache:



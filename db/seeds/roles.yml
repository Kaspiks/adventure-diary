- name: administrator
  description: Full system access - can manage all challenges and attempts
  permissions:
    - users.index
    - users.show
    - users.create
    - users.update
    - users.destroy
    - users.block
    - roles.index
    - roles.show
    - roles.create
    - roles.update
    - roles.destroy
    - challenges.index
    - challenges.show
    - challenges.create
    - challenges.update
    - challenges.destroy
    - challenges.review
    - attempts.index
    - attempts.show
    - attempts.approve
    - attempts.reject
    - rewards.index
    - rewards.show
    - rewards.create
    - rewards.update
    - rewards.destroy
    - locations.index
    - locations.show
    - locations.create
    - locations.update
    - locations.destroy
    - dashboard.view
    - settings.view
    - settings.update

- name: company_user
  description: Can create challenges and review attempts for their own challenges
  permissions:
    - challenges.index
    - challenges.show
    - challenges.create
    - challenges.update_own
    - challenges.destroy_own
    - challenges.review_own
    - attempts.index_own
    - attempts.show_own
    - attempts.approve_own
    - attempts.reject_own
    - dashboard.view

- name: general_user
  description: Regular users who browse and complete challenges
  permissions:
    - challenges.index
    - challenges.show
    - attempts.start
    - attempts.submit_own
    - attempts.index_own
    - attempts.show_own
